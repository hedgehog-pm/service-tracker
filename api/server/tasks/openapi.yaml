openapi: 3.0.3
info:
  title: Tracker tasks
  version: 0.1.0
paths:
  /projects/{project_id}/tasks:
    $ref: "#/x-paths/collection"
  /projects/{project_id}/tasks/{task_id}:
    $ref: "#/x-paths/item"
components:
  schemas:
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - number
      - key
      - module_id
      - status_id
      - title
      - description
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        project_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        number:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+-[1-9][0-9]*$"
          example: WEB-1
        module_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          nullable: true
        status_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTask:
      type: object
      additionalProperties: false
      required:
      - title
      - status_id
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        module_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          nullable: true
      description: 'description можно опустить: домен установит пустую строку. module_id
        можно опустить или передать null: задача без модуля. Номер, ключ и время устанавливает
        приложение.'
    UpdateTask:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - status_id
      - module_id
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        module_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          nullable: true
      description: 'Полная замена изменяемых полей. Все четыре поля обязательны; module_id:
        null снимает модуль. project_id, number, key и время передавать запрещено.'
    TaskList:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        limit:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
x-paths:
  collection:
    get:
      operationId: listTasks
      tags:
      - tasks
      summary: 'Список: tasks'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - $ref: ../common/openapi.yaml#/components/parameters/Limit
      - $ref: ../common/openapi.yaml#/components/parameters/Offset
      - name: status_id
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: module_id
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      description: Порядок number ASC. Фильтры объединяются через AND. Неизвестный
        статус или модуль даёт пустой список. Несуществующий проект даёт 404.
      responses:
        '200':
          description: Список ресурсов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
    post:
      operationId: createTask
      tags:
      - tasks
      summary: 'Задача: создание'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
  item:
    get:
      operationId: getTask
      tags:
      - tasks
      summary: 'Задача: чтение'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    put:
      operationId: updateTask
      tags:
      - tasks
      summary: 'Задача: замена изменяемых полей'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        '200':
          description: Ресурс изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    delete:
      operationId: deleteTask
      tags:
      - tasks
      summary: 'Задача: удаление'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '204':
          description: Ресурс удалён
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
      description: Удаление задачи не уменьшает счётчик проекта и не освобождает номер.
