openapi: 3.0.3
info:
  title: Tracker projects
  version: 0.1.0
paths:
  /projects:
    $ref: "#/x-paths/collection"
  /projects/{project_id}:
    $ref: "#/x-paths/item"
components:
  schemas:
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - name
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+$"
        name:
          type: string
          minLength: 1
    CreateProject:
      type: object
      additionalProperties: false
      required:
      - key
      - name
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+$"
        name:
          type: string
          minLength: 1
    UpdateProject:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    ProjectList:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        limit:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
x-paths:
  collection:
    get:
      operationId: listProjects
      tags:
      - projects
      summary: 'Список: projects'
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/Limit
      - $ref: ../common/openapi.yaml#/components/parameters/Offset
      description: 'Порядок id ASC. Пустой список передаётся как items: [].'
      responses:
        '200':
          description: Список ресурсов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    post:
      operationId: createProject
      tags:
      - projects
      summary: 'Проект: создание'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  item:
    get:
      operationId: getProject
      tags:
      - projects
      summary: 'Проект: чтение'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    put:
      operationId: updateProject
      tags:
      - projects
      summary: 'Проект: замена изменяемых полей'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        '200':
          description: Ресурс изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    delete:
      operationId: deleteProject
      tags:
      - projects
      summary: 'Проект: удаление'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '204':
          description: Ресурс удалён
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
      description: Каскадно удаляет статусы, модули и задачи проекта одной операцией
        БД.
