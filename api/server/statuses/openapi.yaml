openapi: 3.0.3
info:
  title: Tracker statuses
  version: 0.2.0
paths:
  /projects/{project_id}/statuses:
    $ref: '#/x-paths/collection'
components:
  schemas:
    Status:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - category
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        name:
          type: string
        category:
          type: string
          enum:
          - todo
          - in_progress
          - done
    StatusList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Status'
x-paths:
  collection:
    get:
      operationId: listStatuses
      tags:
      - statuses
      summary: Статусы workflow схемы проекта
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusList'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
