openapi: 3.0.3
info:
  title: Tracker boards
  version: 0.2.0
paths:
  /projects/{project_id}/boards:
    $ref: '#/x-paths/collection'
  /projects/{project_id}/boards/{board_id}:
    $ref: '#/x-paths/item'
  /projects/{project_id}/boards/{board_id}/columns:
    $ref: '#/x-paths/columns'
  /projects/{project_id}/boards/{board_id}/columns/{column_id}:
    $ref: '#/x-paths/column'
  /projects/{project_id}/boards/{board_id}/columns/{column_id}/tasks:
    $ref: '#/x-paths/column-tasks'
  /projects/{project_id}/boards/{board_id}/tasks/{task_id}/move:
    $ref: '#/x-paths/move'
components:
  schemas:
    BoardSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - name
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        project_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        name:
          type: string
          minLength: 1
    Board:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - name
      - columns
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        project_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        name:
          type: string
          minLength: 1
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
    BoardColumn:
      type: object
      additionalProperties: false
      required:
      - id
      - board_id
      - name
      - position
      - status_ids
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        board_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        name:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
        status_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int32
            x-go-type: int
            minimum: 1
    CreateBoard:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    UpdateBoard:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    CreateBoardColumn:
      type: object
      additionalProperties: false
      required:
      - name
      - position
      - status_ids
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
        status_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int32
            x-go-type: int
            minimum: 1
    UpdateBoardColumn:
      type: object
      additionalProperties: false
      required:
      - name
      - position
      - status_ids
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
        status_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int32
            x-go-type: int
            minimum: 1
    BoardList:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoardSummary'
        limit:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
    BoardColumnTaskList:
      $ref: ../tasks/openapi.yaml#/components/schemas/TaskList
    MoveBoardTask:
      type: object
      additionalProperties: false
      required:
      - column_id
      - before_task_id
      - transition_id
      properties:
        column_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        before_task_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          nullable: true
        transition_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          nullable: true
  parameters:
    BoardID:
      name: board_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        x-go-type: int
        minimum: 1
    ColumnID:
      name: column_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        x-go-type: int
        minimum: 1
x-paths:
  collection:
    get:
      operationId: listBoards
      tags:
      - boards
      summary: Получить доски одного проекта
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: ../common/openapi.yaml#/components/parameters/Limit
      - $ref: ../common/openapi.yaml#/components/parameters/Offset
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardList'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    post:
      operationId: createBoard
      tags:
      - boards
      summary: Создать доску
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoard'
            example:
              name: Разработка
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  item:
    get:
      operationId: getBoard
      tags:
      - boards
      summary: Получить доску с колонками
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    put:
      operationId: updateBoard
      tags:
      - boards
      summary: Переименовать доску
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoard'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    delete:
      operationId: deleteBoard
      tags:
      - boards
      summary: Удалить доску
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      responses:
        '204':
          description: ''
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  columns:
    post:
      operationId: createBoardColumn
      tags:
      - boards
      summary: Добавить колонку
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardColumn'
            example:
              name: В работе
              position: 0
              status_ids:
              - 2
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumn'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  column:
    put:
      operationId: updateBoardColumn
      tags:
      - boards
      summary: Изменить колонку
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      - $ref: '#/components/parameters/ColumnID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardColumn'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumn'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    delete:
      operationId: deleteBoardColumn
      tags:
      - boards
      summary: Удалить колонку
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      - $ref: '#/components/parameters/ColumnID'
      responses:
        '204':
          description: ''
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  column-tasks:
    get:
      operationId: listBoardColumnTasks
      tags:
      - boards
      summary: Получить задачи колонки с фильтрами
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      - $ref: '#/components/parameters/ColumnID'
      - $ref: ../common/openapi.yaml#/components/parameters/Limit
      - $ref: ../common/openapi.yaml#/components/parameters/Offset
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
          pattern: '^[^\x00]*$'
      - name: status
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: module
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: priority
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      - name: task_type
        in: query
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumnTaskList'
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  move:
    post:
      operationId: moveBoardTask
      tags:
      - boards
      summary: Переместить задачу на доске
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      - $ref: '#/components/parameters/BoardID'
      - $ref: ../common/openapi.yaml#/components/parameters/TaskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveBoardTask'
            example:
              column_id: 11
              before_task_id: 7
              transition_id: null
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: ../tasks/openapi.yaml#/components/schemas/Task
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
