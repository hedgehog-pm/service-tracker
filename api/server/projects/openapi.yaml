openapi: 3.0.3
info:
  title: Tracker projects
  version: 0.2.0
paths:
  /projects:
    $ref: "#/x-paths/collection"
  /projects/{project_id}:
    $ref: "#/x-paths/item"
  /projects/{project_id}/summary:
    $ref: "#/x-paths/summary"
components:
  schemas:
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - name
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+$"
        name:
          type: string
          minLength: 1
    ProjectSummary:
      type: object
      additionalProperties: false
      required:
      - tasks_total
      - tasks_open
      - tasks_due_soon
      - tasks_overdue
      - total_time_spent_seconds
      - total_estimate_seconds
      - upcoming_tasks
      properties:
        tasks_total:
          type: integer
          format: int64
          minimum: 0
        tasks_open:
          type: integer
          format: int64
          minimum: 0
        tasks_due_soon:
          type: integer
          format: int64
          minimum: 0
        tasks_overdue:
          type: integer
          format: int64
          minimum: 0
        total_time_spent_seconds:
          type: integer
          format: int64
          minimum: 0
        total_estimate_seconds:
          type: integer
          format: int64
          nullable: true
        upcoming_tasks:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/UpcomingTask"
    UpcomingTask:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - title
      - status_id
      - priority_id
      - due_date
      properties:
        id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        key:
          type: string
        title:
          type: string
        status_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        priority_id:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
        due_date:
          type: string
          format: date
    CreateProject:
      type: object
      additionalProperties: false
      required:
      - key
      - name
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+$"
        name:
          type: string
          minLength: 1
    UpdateProject:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    ProjectList:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        limit:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
          maximum: 200
        offset:
          type: integer
          format: int32
          x-go-type: int
          minimum: 0
x-paths:
  summary:
    get:
      operationId: getProjectSummary
      tags:
      - projects
      summary: Получить сводку проекта
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/ProjectID
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  collection:
    get:
      operationId: listProjects
      tags:
      - projects
      summary: Получить список проектов
      parameters:
      - $ref: ../common/openapi.yaml#/components/parameters/Limit
      - $ref: ../common/openapi.yaml#/components/parameters/Offset
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    post:
      operationId: createProject
      tags:
      - projects
      summary: Создать проект со стартовой доской
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        '201':
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
  item:
    get:
      operationId: getProject
      tags:
      - projects
      summary: Получить проект по идентификатору
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    put:
      operationId: updateProject
      tags:
      - projects
      summary: Переименовать проект
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/openapi.yaml#/components/responses/Conflict
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
    delete:
      operationId: deleteProject
      tags:
      - projects
      summary: Удалить проект со всеми задачами и модулями
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          x-go-type: int
          minimum: 1
      responses:
        '204':
          description: ""
        '400':
          $ref: ../common/openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: ../common/openapi.yaml#/components/responses/NotFound
        '500':
          $ref: ../common/openapi.yaml#/components/responses/InternalError
